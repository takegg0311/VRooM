services:
  app:
    build:
     context: .
     dockerfile: Dockerfile
    tty: true
    ports:
      - 3000:3000
    volumes:
      - node_modules:/app/node_modules
      - ./:/app:cached
    # .env に値があればそれを使い、空なら Firebase Emulator 用のダミー値を使う
    environment:
      NEXT_PUBLIC_USE_FIREBASE_EMULATOR: ${NEXT_PUBLIC_USE_FIREBASE_EMULATOR:-true}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-demo-api-key}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-demo-vroom.firebaseapp.com}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-demo-vroom}
      NEXT_PUBLIC_FIREBASE_TEST_ACCOUNT_EMAIL: ${NEXT_PUBLIC_FIREBASE_TEST_ACCOUNT_EMAIL:-test@example.com}
      NEXT_PUBLIC_FIREBASE_TEST_ACCOUNT_PASSWORD: ${NEXT_PUBLIC_FIREBASE_TEST_ACCOUNT_PASSWORD:-testpassword}
    depends_on:
      - firebase

  # Firebase Emulator Suite（Auth / Firestore）。projectId が demo- で始まるため実プロジェクト不要
  firebase:
    build:
     context: .
     dockerfile: Dockerfile
    working_dir: /app
    command: sh /app/scripts/start-emulators.sh
    environment:
      FIREBASE_PROJECT_ID: demo-vroom
      TEST_ACCOUNT_EMAIL: ${NEXT_PUBLIC_FIREBASE_TEST_ACCOUNT_EMAIL:-test@example.com}
      TEST_ACCOUNT_PASSWORD: ${NEXT_PUBLIC_FIREBASE_TEST_ACCOUNT_PASSWORD:-testpassword}
    ports:
      - 4000:4000 # Emulator UI
      - 4400:4400 # Emulator Hub
      - 4500:4500 # Logging
      - 9099:9099 # Auth
      - 8081:8081 # Firestore
      - 9150:9150 # Firestore WebSocket（Emulator UI 用）
    volumes:
      - ./firebase.json:/app/firebase.json:ro
      - ./scripts:/app/scripts:ro
      - firebase_data:/data
    # 停止時にデータをエクスポートさせるため SIGINT で止める
    stop_signal: SIGINT
    stop_grace_period: 30s

volumes:
  node_modules: {}
  firebase_data: {}
